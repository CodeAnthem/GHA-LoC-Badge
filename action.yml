name: 'Lines of Code Badge'
description: 'Count physical lines and write an SVG badge. Publish that file when badge_branch is set.'
inputs:
  directory:
    description: 'The directory to scan.'
    required: false
    default: './'
  badge:
    description: 'The output path to save the badge svg - including extension!'
    required: false
    default: './badge.svg'
  patterns:
    description: 'The file patterns to search for, separated by pipes ("|").'
    required: false
    default: "**"
  ignore:
    description: 'The file patterns to ignore, even if they matched "patterns", separated by pipes ("|").'
    required: false
    default: "node_modules"
  badge_label:
    description: "The label to use for the badge."
    required: false
    default: "Lines of Code"
  badge_color:
    description: "The color to use for the badge."
    required: false
    default: "blue"
  badge_style:
    description: "The body style to use for the badge. ('flat' or 'classic')"
    required: false
    default: "classic"
  badge_scale:
    description: "The scale to resize this badge"
    required: false
    default: "1"
  badge_labelcolor:
    description: "The color to use for this badge label."
    required: false
    default: "555"
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
  ignore_blank_lines:
    description: 'Skip blank lines. A line of spaces or tabs is blank. Set to false to count those lines.'
    required: false
    default: 'true'
  badge_branch:
    description: 'Branch that receives the badge file. Empty skips publishing. Publishing reads GH_TOKEN from the environment and replaces that branch with the badge file only.'
    required: false
    default: ''


outputs:
  total_lines:
    description: 'The total line count.'
  counted_files:
    description: 'A count of all files that were included in the total.'
  elapsed_ms:
    description: 'The time that this scan took.'
  output_path:
    description: 'The absolute path to the SVG that was generated.'
  output_dir:
    description: 'The absolute path to the directory that contains the output svg.'
  ignored_files:
    description: 'How many matching files were excluded by ignore patterns.'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'award'  
  color: 'green'
