name: Badge image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Count lines
        uses: ./
        with:
          directory: ./
          badge: loc.svg
          ignore: "node_modules|dist"

      - name: Publish loc.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          test -f loc.svg
          tmp="$(mktemp -d)"
          cp loc.svg "$tmp/loc.svg"
          cd "$tmp"
          git init -b images
          git add loc.svg
          test "$(git ls-files)" = "loc.svg"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update lines-of-code badge"
          gh auth setup-git
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/images
